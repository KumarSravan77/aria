service:
  id: payments-api
  name: Payments API
  owner_team: payments
  tier: tier1
  runtime: java
  framework: spring-boot
  deployment_model: kubernetes
  gitops: argocd
  compliance:
  - pci
  golden_path: java-springboot-tier1
  slo_targets:
    availability: 99.95
    p95_latency_ms: 300
    error_rate_percent: 0.1
  eventing:
    publishes_transaction_events: true
    topic: transactions.events
    schema: transaction-event-v1
    dlq: transactions.events.dlq
    pii_tokenization: true
    lineage_enabled: true
    consumer_lag_slo: true
    idempotency_key: true
    replay_support: true
  risk_scoring:
    enabled: true
    model_mapping: payments-aml-risk-model
    risk_score_response: true
    explainability: true
    audit_log: true
    case_management_handoff: true
    latency_slo_ms: 150
  devsecops:
    sast: true
    sca: true
    container_scan: true
    secret_scan: true
    iac_scan: true
    sbom: true
    image_signing: true
    policy_as_code: true
    admission_policy: true
    runtime_detection: true
    security_gate_before_deploy: true
    tools:
    - semgrep
    - sonarqube
    - dependabot
    - snyk
    - trivy
    - gitleaks
    - checkov
    - tfsec
    - syft
    - cosign
    - kyverno
    - gatekeeper
    - falco
