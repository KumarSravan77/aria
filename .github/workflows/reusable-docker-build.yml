name: Reusable Docker Build

on:
  workflow_call:
    inputs:
      service_id:
        required: true
        type: string
      app_path:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      push_image:
        required: false
        type: boolean
        default: false

jobs:
  docker:
    name: Docker build ${{ inputs.service_id }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: inputs.push_image == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.app_path }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push_image }}
          tags: ghcr.io/${{ github.repository }}/${{ inputs.service_id }}:${{ github.sha }}
