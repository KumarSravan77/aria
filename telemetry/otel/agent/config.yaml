apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: telemetry
data:
  collector.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        include_file_path: true
        start_at: end
        operators:
          - type: container
          - type: json_parser
            parse_from: body
            if: 'body matches "^\\{"'
      hostmetrics:
        collection_interval: 30s
        scrapers: {cpu: {}, memory: {}, filesystem: {}, network: {}}
      otlp:
        protocols: {grpc: {}, http: {}}
    processors:
      memory_limiter: {check_interval: 2s, limit_mib: 384, spike_limit_mib: 96}
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
      resource:
        attributes:
          - {key: deployment.environment.name, value: local, action: upsert}
          - {key: k8s.cluster.name, value: aria-local, action: upsert}
      filter/noise:
        error_mode: ignore
        traces:
          span: ['attributes["http.route"] == "/health" or attributes["http.route"] == "/ready"']
      batch: {timeout: 2s, send_batch_size: 2048, send_batch_max_size: 4096}
    exporters:
      otlp/gateway:
        endpoint: otel-gateway.telemetry.svc.cluster.local:4317
        tls: {insecure: true}
        sending_queue: {enabled: true, queue_size: 4096, num_consumers: 4}
        retry_on_failure: {enabled: true, initial_interval: 1s, max_interval: 30s, max_elapsed_time: 300s}
    service:
      telemetry: {metrics: {address: 0.0.0.0:8888}}
      pipelines:
        logs: {receivers: [filelog, otlp], processors: [memory_limiter, k8sattributes, resource, batch], exporters: [otlp/gateway]}
        metrics: {receivers: [hostmetrics, otlp], processors: [memory_limiter, k8sattributes, resource, batch], exporters: [otlp/gateway]}
        traces: {receivers: [otlp], processors: [memory_limiter, k8sattributes, resource, filter/noise, batch], exporters: [otlp/gateway]}
