deploymentMode: Distributed
loki:
  auth_enabled: true
  commonConfig: {replication_factor: 3}
  schemaConfig:
    configs:
      - {from: "2024-01-01", store: tsdb, object_store: s3, schema: v13, index: {prefix: index_, period: 24h}}
  storage:
    type: s3
    bucketNames: {chunks: loki-chunks, ruler: loki-ruler, admin: loki-admin}
    s3: {endpoint: http://minio.telemetry.svc.cluster.local:9000, region: us-east-1, accessKeyId: "${MINIO_ACCESS_KEY}", secretAccessKey: "${MINIO_SECRET_KEY}", s3ForcePathStyle: true, insecure: true}
  limits_config:
    retention_period: 720h
    ingestion_rate_mb: 50
    ingestion_burst_size_mb: 100
    max_global_streams_per_user: 100000
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor: {retention_enabled: true, delete_request_store: s3}
gateway: {replicas: 3}
write: {replicas: 3}
read: {replicas: 3}
backend: {replicas: 3}
monitoring: {serviceMonitor: {enabled: true}}
chunksCache: {enabled: true}
resultsCache: {enabled: true}
