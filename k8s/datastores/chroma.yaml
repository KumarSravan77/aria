apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:0.5.23
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/chroma
          readinessProbe:
            httpGet: {path: /api/v1/heartbeat, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: chroma-data
          persistentVolumeClaim: {claimName: chroma-data}
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: sre
spec:
  selector:
    app: chroma
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  namespace: sre
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
