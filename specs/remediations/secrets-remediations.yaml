remediation:
  name: secrets-remediations
  allowed_actions:
    leaked_secret:
      - redact_artifact
      - revoke_secret
      - rotate_secret
      - create_security_ticket
    static_ci_secret:
      - migrate_to_oidc
      - update_vault_policy
      - remove_static_secret_reference
    k8s_secret_env_exposure:
      - migrate_to_external_secrets_operator
      - enforce_least_privilege_secret_store
      - restart_workload_after_rotation
safety:
  default_mode: dry_run
  production_requires_approval: true
  require_health_validation_after_rotation: true
