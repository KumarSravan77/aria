apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-application-observability-dashboard
  namespace: monitoring
  labels: {grafana_dashboard: "1"}
data:
  aria-application-overview.json: |
    {"title":"ARIA End-to-End Application Observability","uid":"aria-app-e2e","schemaVersion":39,"tags":["aria","opentelemetry"],"panels":[{"type":"timeseries","title":"Request rate","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (service_name) (rate(traces_span_metrics_calls_total[5m]))"}],"gridPos":{"x":0,"y":0,"w":12,"h":8}},{"type":"timeseries","title":"p99 latency","datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.99, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket[5m])))"}],"gridPos":{"x":12,"y":0,"w":12,"h":8}},{"type":"logs","title":"Correlated application logs","datasource":{"type":"loki","uid":"loki"},"targets":[{"expr":"{namespace=\"demo\"} | json"}],"gridPos":{"x":0,"y":8,"w":12,"h":9}},{"type":"traces","title":"Distributed traces","datasource":{"type":"tempo","uid":"tempo"},"targets":[{"queryType":"traceql","query":"{ resource.service.namespace = \"aria-demo\" }"}],"gridPos":{"x":12,"y":8,"w":12,"h":9}}]}
