agent:
  name: secret-governance-agent
  type: specialist
  version: 1.0.0
purpose:
  summary: Detect and govern secret exposure across CI/CD, Kubernetes, RAG, logs, prompts, and repo inputs.
inputs:
  required:
    - service_id
    - environment
  optional:
    - repo_snapshot
    - cicd_pipeline
    - kubernetes_manifests
    - rag_documents
    - build_logs
checks:
  - hardcoded_secret_detection
  - ci_static_secret_detection
  - vault_short_lived_credential_usage
  - external_secrets_operator_usage
  - rag_redaction_required
  - prompt_secret_redaction_required
  - k8s_secret_env_exposure
  - rotation_policy_presence
outputs:
  - secret_governance_score
  - secret_findings
  - sanitized_payload_preview
  - remediation_recommendations
safety:
  never_return_raw_secret: true
  redact_before_prompt: true
  redact_before_rag_indexing: true
  approval_required_for_rotation: true
