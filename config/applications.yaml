# ARIA multi-application service catalog used by GitHub Actions and service review.
# Each onboarded application can reuse the same CI/CD standards with its own profile.
applications:
  - service_id: banking-api
    app_path: apps/banking-api
    language: python
    framework: fastapi
    dockerfile: apps/banking-api/Dockerfile
    helm_chart: k8s/apps/banking-demo.yaml
    service_profile: examples/self_service/service_review_request.json
    tier: tier1
    owner_team: platform
    slo_profile: gold
  - service_id: fraud-detection-api
    app_path: apps/fraud-detection-api
    language: python
    framework: fastapi
    dockerfile: apps/fraud-detection-api/Dockerfile
    helm_chart: k8s/apps/banking-demo.yaml
    service_profile: examples/self_service/service_review_request.json
    tier: tier2
    owner_team: platform
    slo_profile: silver
  - service_id: transaction-ledger-api
    app_path: apps/transaction-ledger-api
    language: python
    framework: fastapi
    dockerfile: apps/transaction-ledger-api/Dockerfile
    helm_chart: k8s/apps/banking-demo.yaml
    service_profile: examples/self_service/service_review_request.json
    tier: tier1
    owner_team: payments
    slo_profile: gold
