apiVersion: v1
kind: ServiceAccount
metadata: {name: otel-agent, namespace: telemetry}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: aria-otel-agent}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: aria-otel-agent}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aria-otel-agent}
subjects: [{kind: ServiceAccount, name: otel-agent, namespace: telemetry}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: otel-agent, namespace: telemetry}
spec:
  selector: {matchLabels: {app: otel-agent}}
  template:
    metadata: {labels: {app: otel-agent}}
    spec:
      serviceAccountName: otel-agent
      tolerations: [{operator: Exists}]
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.147.0
          args: [--config=/etc/otel/collector.yaml]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
          volumeMounts:
            - {name: config, mountPath: /etc/otel}
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-agent-config}
        - name: varlogpods
          hostPath: {path: /var/log/pods}
