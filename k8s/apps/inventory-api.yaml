apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory-api, namespace: demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: inventory-api}}
  template:
    metadata: {labels: {app: inventory-api}}
    spec:
      containers:
        - name: inventory-api
          image: inventory-api:local
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 9100}]
          env:
            - {name: INVENTORY_DELAY_MS, value: "0"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: otel-gateway.telemetry.svc.cluster.local:4317}
            - {name: OTEL_PROPAGATORS, value: "tracecontext,baggage"}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true}
---
apiVersion: v1
kind: Service
metadata: {name: inventory-api, namespace: demo, labels: {app: inventory-api}}
spec: {selector: {app: inventory-api}, ports: [{name: http, port: 9100, targetPort: http}]}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: inventory-api, namespace: demo, labels: {release: kube-prometheus-stack}}
spec:
  selector: {matchLabels: {app: inventory-api}}
  endpoints: [{port: http, path: /metrics, interval: 15s}]
