name: ARIA Secrets Guard

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  secrets-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run lightweight secret pattern scan on source files
        run: |
          python - <<'PY'
          import pathlib, re, sys
          patterns = [
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"(?i)(api[_-]?key|token|secret|password)\s*[:=]\s*['\"](?!\$\{|<|\[|REDACTED|example|changeme|dummy)[^'\"\s]{16,}['\"]"),
          ]
          skip_dirs = {'.git', '.venv', 'node_modules', 'chroma', '__pycache__', 'docs', 'examples', 'tests'}
          skip_files = {'.env', '.env.example'}
          findings = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or path.name in skip_files or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(errors='ignore')
              except Exception:
                  continue
              for p in patterns:
                  if p.search(text):
                      findings.append(str(path))
                      break
          if findings:
              print('Potential secrets found:')
              print('\n'.join(findings[:50]))
              sys.exit(1)
          print('No obvious secret patterns found')
          PY
