name: AML MLOps CI

on:
  pull_request:
    paths:
      - 'platform/aml-mlops/**'
      - 'specs/**'
      - 'server/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'platform/aml-mlops/**'
      - 'specs/**'
      - 'server/**'
      - 'tests/**'

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pyyaml
      - name: Run ARIA tests
        run: python -m pytest tests/test_aml_mlops_project.py tests/test_standard_enterprise_architecture.py -q
      - name: Validate Kubernetes/Istio manifests are present
        run: |
          test -f platform/aml-mlops/istio/aml-inference-traffic.yaml
          test -f platform/aml-mlops/argocd/aml-feature-pipeline-app.yaml
      - name: Build image placeholder
        run: echo "Build and publish AML feature/inference images here"
