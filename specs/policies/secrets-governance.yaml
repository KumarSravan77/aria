policy:
  name: secrets-governance
  version: 1.0.0
rules:
  - id: no-raw-secret-in-agent-output
    severity: P0
    decision: block
    description: ARIA agents must never print raw secrets in responses, reports, prompts, or remediation plans.
  - id: redact-before-rag
    severity: P0
    decision: block
    description: Documents/logs must be redacted before vectorization or operational memory storage.
  - id: short-lived-credentials
    severity: P1
    decision: warn
    description: CI/CD and agents should use OIDC/Vault/cloud identity federation instead of long-lived keys.
  - id: approval-for-rotation
    severity: P1
    decision: approval_required
    description: Secret rotation that mutates production workloads requires approval and rollback validation.
