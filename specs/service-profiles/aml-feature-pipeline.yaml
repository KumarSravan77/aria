service:
  id: aml-feature-pipeline
  name: aml-feature-pipeline
  owner_team: fraud-platform-sre
  tier: tier1
  language: python
  framework: apache-beam
  runtime: kubernetes
  workload_type: mlops
  golden_path: python-aml-mlops
  deployment_target: kubernetes
  environment: prod
  compliance:
  - fintrac
  - pii
  slo:
    pipeline_success_rate: 99.9
    freshness_minutes: 15
    inference_latency_p99_ms: 250
  feature_store: feast
  model_registry: mlflow
  retraining_trigger: daily_or_drift
  risk_profile: mlops-fintrac
  mesh: istio
  gitops: argocd
  delivery:
    ci: github-actions
    cd: argocd
    deployment_strategy: canary
    registry: ghcr
  observability:
    otel: true
    prometheus: true
    grafana: true
    dynatrace: true
    mesh_telemetry: true
  eventing:
    publishes_transaction_events: false
    topic: transactions.events
    schema: transaction-event-v1
    dlq: transactions.events.dlq
    pii_tokenization: true
    lineage_enabled: true
    consumer_lag_slo: true
    idempotency_key: true
    replay_support: true
  risk_scoring:
    enabled: true
    model_mapping: aml-enterprise-default-risk-model
    risk_score_response: true
    explainability: true
    audit_log: true
    case_management_handoff: true
    latency_slo_ms: 150
  devsecops:
    sast: true
    sca: true
    container_scan: true
    secret_scan: true
    iac_scan: true
    sbom: true
    image_signing: true
    policy_as_code: true
    admission_policy: true
    runtime_detection: true
    security_gate_before_deploy: true
    tools:
    - semgrep
    - sonarqube
    - dependabot
    - snyk
    - trivy
    - gitleaks
    - checkov
    - tfsec
    - syft
    - cosign
    - kyverno
    - gatekeeper
    - falco
