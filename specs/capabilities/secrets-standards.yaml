capability:
  name: secrets-standards
  version: 1.0.0
requirements:
  raw_secret_storage_forbidden: true
  rag_indexing_requires_redaction: true
  llm_prompts_require_redaction: true
  ci_credentials:
    preferred: oidc_to_vault_or_cloud_secret_manager
    forbidden:
      - long_lived_static_cloud_keys
      - plaintext_pipeline_tokens
  kubernetes:
    preferred:
      - external_secrets_operator
      - vault_agent_injector
      - workload_identity
    require_secret_rotation_policy: true
  vault:
    require_short_lived_leases: true
    default_ttl_seconds: 900
    require_lease_revocation: true
score_weights:
  hardcoded_secret_absent: 30
  oidc_enabled: 20
  eso_or_vault_injector_enabled: 20
  rotation_policy: 15
  rag_redaction: 15
