apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telemetry
resources:
  - ../../base
  - ../../otel/agent
  - ../../otel/gateway
  - ../../buffering
  - ../../processing
patches:
  - target: {kind: StatefulSet, name: redpanda}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 500Gi
