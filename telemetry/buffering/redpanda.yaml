apiVersion: v1
kind: Service
metadata: {name: redpanda, namespace: telemetry}
spec:
  clusterIP: None
  selector: {app: redpanda}
  ports:
    - {name: kafka, port: 9092}
    - {name: admin, port: 9644}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redpanda, namespace: telemetry}
spec:
  serviceName: redpanda
  replicas: 3
  selector: {matchLabels: {app: redpanda}}
  template:
    metadata: {labels: {app: redpanda}}
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.3.3
          args:
            - redpanda
            - start
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --overprovisioned
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=$(POD_NAME).redpanda.telemetry.svc.cluster.local:9092
          env: [{name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}]
          ports: [{name: kafka, containerPort: 9092}, {name: admin, containerPort: 9644}]
          readinessProbe: {httpGet: {path: /v1/status/ready, port: admin}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts: [{name: data, mountPath: /var/lib/redpanda/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: redpanda-topic-bootstrap, namespace: telemetry}
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: redpandadata/redpanda:v24.3.3
          command: [sh, -ec]
          args:
            - |
              until rpk cluster health -X brokers=redpanda:9092; do sleep 3; done
              rpk topic create otlp-logs -p 12 -r 3 -X brokers=redpanda:9092 || true
              rpk topic create otlp-logs-dlq -p 3 -r 3 -X brokers=redpanda:9092 || true
              rpk topic alter-config otlp-logs --set retention.ms=86400000 -X brokers=redpanda:9092
