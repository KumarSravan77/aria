apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-health-probes
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-readiness-liveness
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "All containers must include readiness and liveness probes."
        pattern:
          spec:
            containers:
              - readinessProbe: "?*"
                livenessProbe: "?*"
