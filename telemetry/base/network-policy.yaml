apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: telemetry-default-deny-ingress, namespace: telemetry}
spec: {podSelector: {}, policyTypes: [Ingress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: telemetry-internal, namespace: telemetry}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: telemetry}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - namespaceSelector: {matchLabels: {telemetry.aria.io/export: "true"}}
