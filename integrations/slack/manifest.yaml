display_information:
  name: ARIA On-Call Copilot
  description: Governed incident investigation, evidence, and approvals
  background_color: "#172B4D"
features:
  bot_user:
    display_name: ARIA
    always_online: true
oauth_config:
  scopes:
    bot: [chat:write, channels:manage, channels:read, commands]
settings:
  interactivity:
    is_enabled: true
    request_url: https://REPLACE_WITH_ARIA_HOST/oncall/webhooks/slack/interactions
  socket_mode_enabled: false
  org_deploy_enabled: false
  token_rotation_enabled: true
