name: ARIA Spec Validation

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'server/platform/spec_engine/**'
      - 'tests/platform/test_spec_driven_platform_complete.py'
  push:
    branches: [ main ]
    paths:
      - 'specs/**'
      - 'server/platform/spec_engine/**'

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
      - name: Evaluate sample service against specs
        run: python scripts/spec_evaluate.py payments-api
      - name: Run spec-driven tests
        run: pytest tests/platform/test_spec_driven_platform_complete.py -q
