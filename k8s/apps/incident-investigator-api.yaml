apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-investigator
  namespace: sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-investigator-role
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-investigator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: incident-investigator-role
subjects:
  - kind: ServiceAccount
    name: incident-investigator
    namespace: sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-investigator-api
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-investigator-api
  template:
    metadata:
      labels:
        app: incident-investigator-api
    spec:
      serviceAccountName: incident-investigator
      containers:
        - name: api
          image: incident-investigator-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: CHROMA_HOST
              value: chroma
            - name: CHROMA_PORT
              value: "8000"
            - name: SELF_HEALING_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: incident-investigator-api
  namespace: sre
spec:
  selector:
    app: incident-investigator-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
