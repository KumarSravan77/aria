apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-image-tag
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-explicit-image-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
      validate:
        message: "Do not use mutable image tag latest."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
