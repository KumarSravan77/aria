apiVersion: v1
kind: Service
metadata: {name: minio, namespace: telemetry}
spec: {selector: {app: minio}, ports: [{name: api, port: 9000}, {name: console, port: 9001}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: minio, namespace: telemetry}
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          args: [server, /data, --console-address=:9001]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: telemetry-object-storage, key: MINIO_ACCESS_KEY}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: telemetry-object-storage, key: MINIO_SECRET_KEY}}}
          ports: [{name: api, containerPort: 9000}, {name: console, containerPort: 9001}]
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
