name: ARIA Platform CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: Run ARIA platform tests
        run: pytest tests/platform tests/test_spec_driven_service_review.py -q
