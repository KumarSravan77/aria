name: Multi-Application ARIA Platform CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  discover-apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: matrix
        name: Build application matrix
        run: |
          python scripts/github_actions_matrix.py config/applications.yaml >> "$GITHUB_OUTPUT"

  app-ci:
    needs: discover-apps
    if: needs.discover-apps.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-apps.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate application source
        run: |
          test -f "${{ matrix.app_path }}/app.py"
          test -f "${{ matrix.dockerfile }}"
          python -m py_compile "${{ matrix.app_path }}/app.py"
      - uses: docker/setup-buildx-action@v3
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app_path }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: aria/${{ matrix.service_id }}:${{ github.sha }}

  security:
    needs: discover-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
