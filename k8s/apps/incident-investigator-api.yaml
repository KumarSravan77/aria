apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-investigator
  namespace: sre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: incident-investigator-role
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: incident-investigator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: incident-investigator-role
subjects:
  - kind: ServiceAccount
    name: incident-investigator
    namespace: sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-investigator-api
  namespace: sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-investigator-api
  template:
    metadata:
      labels:
        app: incident-investigator-api
    spec:
      serviceAccountName: incident-investigator
      containers:
        - name: api
          image: incident-investigator-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: CHROMA_HOST
              value: chroma
            - name: CHROMA_PORT
              value: "8000"
            - name: SELF_HEALING_ENABLED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aria-local-runtime
                  key: database-url
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: ARIA_INTEGRATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: aria-local-runtime
                  key: integration-secret
            - name: OPENMODELOPS_FACTORY_URL
              value: http://factory-api.openmodelops.svc.cluster.local:8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: incident-investigator-api
  namespace: sre
spec:
  selector:
    app: incident-investigator-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
